spring:
  application:
    name: pipeline
  graphql:
    graphiql:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} trace_id=%mdc{trace_id:-} span_id=%mdc{span_id:-} - %msg%n"
---

spring:
  config:
    activate:
      on-profile: basicAuth
  security:
    user:
      name: admin
      password: "{noop}admin"
---

spring:
  config:
    activate:
      on-profile: h2InMemory
  datasource:
    url: jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console


