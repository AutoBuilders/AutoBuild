spring:
  application:
    name: pipeline
  graphql:
    graphiql:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} trace_id=%mdc{trace_id:-} span_id=%mdc{span_id:-} - %msg%n"
---

spring:
  config:
    activate:
      on-profile: basicAuth
  security:
    user:
      name: admin
      password: "{noop}admin"
---

spring:
  config:
    activate:
      on-profile: sqlite
  datasource:
    url: jdbc:sqlite:./autobuild-dev.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect


