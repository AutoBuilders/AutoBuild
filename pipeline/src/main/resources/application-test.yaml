# TODO: Deprecate it and move it into one application.yaml

spring:
  datasource:
    url: jdbc:sqlite:file::memory:?cache=shared
    driver-class-name: org.sqlite.JDBC
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://mock-issuer.test
          jwk-set-uri: https://mock-jwk-set-uri.test

feature-flags:
  provider:
    uri: ${FEATURE_PROVIDER_URI:}
