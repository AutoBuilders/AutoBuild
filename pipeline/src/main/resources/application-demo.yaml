# TODO: Deprecate it and move it into one application.yaml

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driverClassName: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  h2:
    console:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${AUTH_HOST}:${AUTH_PORT}/realms/SpringBootRealm
          jwk-set-uri: http://${AUTH_HOST}:${AUTH_PORT}/realms/SpringBootRealm/protocol/openid-connect/certs

  autoconfigure:
    exclude:
    - org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

feature-flags:
  provider:
    uri: ${FEATURE_PROVIDER_URI:}

logging:
  level:
    org.springframework.jdbc.datasource: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
