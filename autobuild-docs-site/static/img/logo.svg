<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="40" height="40" rx="9" fill="#0f0f1a"/>

  <!-- Pipeline: three nodes connected by lines -->
  <!-- Node 1 -->
  <rect x="5" y="15" width="10" height="10" rx="2.5" fill="none" stroke="url(#grad)" stroke-width="1.8"/>

  <!-- Connector 1→2 -->
  <line x1="15" y1="20" x2="19" y2="20" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="19,17.5 23,20 19,22.5" fill="#3b82f6"/>

  <!-- Node 2 -->
  <rect x="15" y="15" width="10" height="10" rx="2.5" fill="none" stroke="url(#grad)" stroke-width="1.8"/>

  <!-- Connector 2→3 -->
  <line x1="25" y1="20" x2="29" y2="20" stroke="#8b5cf6" stroke-width="1.5"/>
  <polygon points="29,17.5 33,20 29,22.5" fill="#8b5cf6"/>

  <!-- Node 3: filled = deployed/success -->
  <rect x="25" y="15" width="10" height="10" rx="2.5" fill="url(#grad)" fill-opacity="0.25" stroke="url(#grad)" stroke-width="1.8"/>
  <!-- Checkmark inside node 3 -->
  <polyline points="27.5,20 29,21.8 32.5,17.5" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
