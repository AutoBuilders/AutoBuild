<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#fff" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="630" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Pipeline visualization - background nodes -->
  <g opacity="0.12" filter="url(#softglow)">
    <circle cx="160" cy="315" r="40" fill="#3b82f6"/>
    <rect x="220" y="308" width="120" height="14" rx="7" fill="url(#accent)"/>
    <circle cx="390" cy="315" r="40" fill="#8b5cf6"/>
    <rect x="450" y="308" width="120" height="14" rx="7" fill="url(#accent)"/>
    <circle cx="620" cy="315" r="40" fill="#3b82f6"/>
    <rect x="680" y="308" width="120" height="14" rx="7" fill="url(#accent)"/>
    <circle cx="850" cy="315" r="40" fill="#8b5cf6"/>
    <rect x="910" y="308" width="120" height="14" rx="7" fill="url(#accent)"/>
    <circle cx="1080" cy="315" r="40" fill="#3b82f6"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="5" height="470" rx="2.5" fill="url(#accent)" opacity="0.6"/>

  <!-- Main content area -->
  <g transform="translate(130, 0)">

    <!-- Icon: pipeline/build symbol -->
    <g transform="translate(0, 185)" filter="url(#glow)">
      <!-- Stage boxes -->
      <rect x="0" y="0" width="48" height="48" rx="10" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="24" y="32" font-family="monospace" font-size="22" fill="#3b82f6" text-anchor="middle">⬡</text>
      <line x1="50" y1="24" x2="74" y2="24" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="76" y="0" width="48" height="48" rx="10" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
      <text x="100" y="32" font-family="monospace" font-size="22" fill="#8b5cf6" text-anchor="middle">⬡</text>
      <line x1="126" y1="24" x2="150" y2="24" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="152" y="0" width="48" height="48" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="176" y="32" font-family="monospace" font-size="22" fill="#3b82f6" text-anchor="middle">✓</text>
    </g>

    <!-- AutoBuild wordmark -->
    <text x="0" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="96" font-weight="800" letter-spacing="-3" fill="white">
      Auto<tspan fill="url(#accent)">Build</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="28" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Build your CI/CD pipelines with ease
    </text>

    <!-- Divider -->
    <rect x="0" y="420" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

    <!-- URL -->
    <text x="0" y="460" font-family="monospace" font-size="22" fill="#64748b" letter-spacing="0.5">
      autobuilders.github.io/AutoBuild
    </text>

  </g>

  <!-- Right side decorative pipeline diagram -->
  <g transform="translate(820, 140)" opacity="0.85">

    <!-- Vertical pipeline -->
    <line x1="60" y1="30" x2="60" y2="350" stroke="#1e293b" stroke-width="30" stroke-linecap="round"/>

    <!-- Stage 1: Source -->
    <rect x="20" y="30" width="80" height="64" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="55" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">SOURCE</text>
    <text x="60" y="73" font-family="monospace" font-size="18" fill="#3b82f6" text-anchor="middle">⎇</text>

    <!-- Connector -->
    <line x1="60" y1="94" x2="60" y2="118" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- Stage 2: Build -->
    <rect x="20" y="118" width="80" height="64" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="60" y="143" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">BUILD</text>
    <text x="60" y="163" font-family="monospace" font-size="18" fill="#8b5cf6" text-anchor="middle">⚙</text>

    <!-- Connector -->
    <line x1="60" y1="182" x2="60" y2="206" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- Stage 3: Test -->
    <rect x="20" y="206" width="80" height="64" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="231" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">TEST</text>
    <text x="60" y="251" font-family="monospace" font-size="18" fill="#3b82f6" text-anchor="middle">✓</text>

    <!-- Connector -->
    <line x1="60" y1="270" x2="60" y2="294" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- Stage 4: Deploy (highlighted/active) -->
    <rect x="16" y="290" width="88" height="68" rx="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
    <text x="60" y="318" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle">DEPLOY</text>
    <text x="60" y="342" font-family="monospace" font-size="20" fill="#a78bfa" text-anchor="middle">▲</text>

    <!-- Status dot: running -->
    <circle cx="98" cy="324" r="6" fill="#10b981" filter="url(#glow)"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="595" width="1200" height="35" fill="#0a0a14"/>
  <text x="130" y="618" font-family="monospace" font-size="14" fill="#334155">
    CI/CD  ·  Pipeline Automation  ·  Low-code  ·  Open Source
  </text>
</svg>
