name: AutoBuild CI

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]

jobs:
  pipeline-service-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          java-version: "17"

      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
        with:
          cache-save: "false"

      - name: Pipeline Service Validation
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
        run: bazel test //pipeline:test --test_output=all

  openapi-contract-check:
    runs-on: ubuntu-latest
    needs: pipeline-service-validation
    steps:
      - uses: actions/checkout@v4

      - name: Check for OpenAPI contract violation
        uses: ./.github/actions/openapi-changes
        with:
          base-ref: ${{ github.base_ref }}
          has-pipeline-validations-executed: "true"

  pipeline-ui-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "22"

      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel
        with:
          cache-save: "false"

      - name: Pipeline UI Validation
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
        run: bazel test //pipeline-ui:unit_test --test_output=all
