name: OpenAPI contract violation check
description: Generates OpenAPI spec and checks it is in sync with the committed spec and has not been manually edited.

inputs:
  base-ref:
    required: true
    description: Reference to base github branch
  service-src-dir:
    required: true
    description: Path to the service source directory to watch for changes (e.g. pipeline/src)

runs:
  using: composite
  steps:
    - name: Generate OpenAPI Spec
      shell: bash
      env:
        WORKSPACE_DIR: ${{ github.workspace }}
      run: bazel build --config=openapi //pipeline:generate-openapi

    - name: Check for contract violation
      shell: bash
      run: |
        git fetch origin ${{ inputs.base-ref }}
        PIPELINE_CHANGED=$(git diff --name-only origin/${{ inputs.base-ref }}...HEAD | grep "^${{ inputs.service-src-dir }}/" || true)
        SPEC_CHANGED=$(git diff --name-only origin/${{ inputs.base-ref }}...HEAD -- apis/openapi-spec/*.yaml || true)

        if [[ -z "$PIPELINE_CHANGED" && -n "$SPEC_CHANGED" ]]; then
          echo "Manual edit of OpenAPI spec detected without a corresponding service change in ${{ inputs.service-src-dir }}."
          exit 1
        fi

        if ! git diff --quiet -- apis/openapi-spec; then
          echo "OpenAPI spec is out of sync. Run 'bazel build //pipeline:generate-openapi' and commit the result."
          exit 1
        fi

        echo "OpenAPI spec is consistent."
